name: pact

on:
  push:
  pull_request:

env:
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  PACT_BROKER_BASE_URL: https://ever.pactflow.io

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Generate pact
        run: mvn -B -pl consumer test
      - name: Publish pact to PactFlow
        run: mvn -B -pl consumer pact:publish

  provider:
    runs-on: ubuntu-latest
    needs: consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify pacts from PactFlow
        run: mvn -B -pl provider test
